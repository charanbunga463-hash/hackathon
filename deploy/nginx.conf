# Reverse proxy for API Doctor.
#
# The non-obvious requirement here is SSE. The agent activity stream is a
# long-lived text/event-stream response, and nginx's default buffering will hold
# it until the buffer fills — which for a low-rate event stream means the UI
# shows nothing for minutes. `proxy_buffering off` plus a long read timeout is
# what makes the live feed actually live. The app also sends
# `X-Accel-Buffering: no` as a belt-and-braces signal.

worker_processes auto;
events {
    worker_connections 8192;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    server_tokens off;

    # Requests carry a correlation id end to end; generate one if the client
    # did not, so every log line can be tied together.
    map $http_x_request_id $request_id_final {
        default   $http_x_request_id;
        ""        $request_id;
    }

    log_format json escape=json
        '{"time":"$time_iso8601","request_id":"$request_id_final",'
        '"method":"$request_method","uri":"$uri","status":$status,'
        '"duration_s":$request_time,"upstream_s":"$upstream_response_time",'
        '"bytes":$body_bytes_sent,"ua":"$http_user_agent"}';
    access_log /var/log/nginx/access.log json;

    # Coarse edge limits. The application enforces the real per-tenant limits;
    # this exists to blunt a flood before it reaches Python at all.
    limit_req_zone  $binary_remote_addr zone=api:20m   rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=conn:20m;

    upstream api_doctor_backend {
        # Multiple replicas: any worker can serve any request because approvals
        # and events go through Redis. No sticky sessions required.
        server backend:8000 max_fails=3 fail_timeout=15s;
        keepalive 64;
    }

    upstream api_doctor_frontend {
        server frontend:3000;
        keepalive 32;
    }

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1024;
    # Never gzip the event stream: compression buffers, and buffering defeats SSE.
    gzip_proxied off;

    server {
        listen 80;
        server_name _;

        # 0 disables nginx's own body-size check, matching MAX_PROJECT_SIZE_MB=0
        # (unlimited) in the app. nginx rejects an oversized body before the
        # request ever reaches Python, so leaving a 60m cap here would silently
        # override the application setting with a 413.
        client_max_body_size 0;
        # Generous, because a large upload legitimately takes a while. This is
        # the gap between body chunks, not the total upload duration.
        client_body_timeout 300s;
        # Stream the body through instead of buffering the whole archive to
        # nginx's temp directory first.
        proxy_request_buffering off;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id_final;
        proxy_set_header Connection        "";

        # ---- SSE: no buffering, long timeouts -------------------------------
        location /api/events {
            proxy_pass http://api_doctor_backend;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            chunked_transfer_encoding on;
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
            limit_conn conn 20;
        }

        # ---- API ------------------------------------------------------------
        location /api/ {
            proxy_pass http://api_doctor_backend;
            limit_req  zone=api burst=100 nodelay;
            limit_conn conn 60;
            # Repairs are queued and answered with 202, so no request should
            # legitimately run long; this is a safety net, not a design budget.
            proxy_read_timeout 120s;
            proxy_connect_timeout 5s;
        }

        # Health checks: unlimited and unlogged.
        location = /healthz { proxy_pass http://api_doctor_backend; access_log off; }
        location = /readyz  { proxy_pass http://api_doctor_backend; access_log off; }

        # Metrics must not be public. Restrict to the internal network.
        location = /metrics {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny  all;
            proxy_pass http://api_doctor_backend;
            access_log off;
        }

        # ---- UI -------------------------------------------------------------
        location / {
            proxy_pass http://api_doctor_frontend;
            proxy_read_timeout 60s;
        }
    }
}
